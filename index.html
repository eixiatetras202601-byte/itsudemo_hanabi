<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>いつでも花火</title>
<meta name="description" content="季節も場所も選ばない、ひとりぶんの花火大会。発数・色・テンポを選んで、いつでも花火を打ち上げられます。">
<meta name="theme-color" content="#04060f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="いつでも花火">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --sumi:#04060f;
    --kin:#e8b96a;
    --kin-soft:#f5dda9;
    --paper:#f2ece0;
    --mist:rgba(242,236,224,.62);
    --line:rgba(232,185,106,.28);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--sumi);
    color:var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }

  /* 初回だけ出る注意書き（光の明滅について） */
  #notice{
    position:fixed;inset:0;z-index:20;
    display:grid;place-content:center;justify-items:center;gap:22px;
    padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);
    background:rgba(4,6,15,.94);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:opacity .5s ease;
  }
  #notice[hidden]{display:none}
  #notice.fade{opacity:0;pointer-events:none}
  #notice h2{
    margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-size:clamp(19px,5vw,25px);font-weight:600;letter-spacing:.22em;text-align:center;
  }
  #notice p{
    margin:0;max-width:30em;text-align:center;line-height:2;
    font-size:clamp(12px,3.3vw,14px);letter-spacing:.06em;color:var(--mist);
  }
  #noticeGo{
    margin-top:4px;padding:14px 40px;border:none;border-radius:4px;cursor:pointer;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-size:16px;letter-spacing:.4em;text-indent:.4em;color:#2a1c05;font-weight:600;
    background:linear-gradient(180deg,#fbe6b6,var(--kin));
  }
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block}

  #head{
    position:fixed;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top) + 16px) 22px 0;
    pointer-events:none;transition:opacity .6s ease;
  }
  #head h1{
    margin:0;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    font-size:clamp(18px,4.4vw,25px);font-weight:600;letter-spacing:.22em;
    text-shadow:0 2px 18px rgba(0,0,0,.6);
  }
  #head p{margin:.5em 0 0;font-size:clamp(10px,2.5vw,12px);letter-spacing:.16em;color:var(--mist)}
  body.running #head{opacity:.22}

  #hint{
    position:fixed;left:0;right:0;top:46%;margin:0;text-align:center;
    font-size:12px;letter-spacing:.18em;color:rgba(242,236,224,.45);
    pointer-events:none;transition:opacity 1s ease;
  }
  #hint.gone{opacity:0}

  #finale{
    position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:24px;
    opacity:0;pointer-events:none;transition:opacity 1.6s ease;padding-bottom:24vh;
  }
  #finale.show{opacity:1;pointer-events:auto}
  #finale p{
    margin:0;text-align:center;line-height:2.1;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
    font-size:clamp(17px,4.4vw,22px);letter-spacing:.28em;
    text-shadow:0 2px 24px rgba(0,0,0,.7);
  }

  #panel{
    position:fixed;left:0;right:0;bottom:0;
    padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(180deg,rgba(9,14,34,.5),rgba(4,6,15,.95));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
  }
  #panel .stack{max-width:600px;margin:0 auto}
  .settings{display:grid;gap:14px}
  .label{display:block;font-size:11px;letter-spacing:.24em;color:var(--mist);margin-bottom:8px}

  .countline{display:flex;align-items:baseline;gap:6px;margin:-2px 0 2px}
  #countOut{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-size:38px;line-height:1;font-weight:600;color:var(--kin-soft);font-variant-numeric:tabular-nums;
  }
  .unit{font-size:13px;color:var(--mist);letter-spacing:.1em}
  .est{margin-left:auto;font-size:11px;letter-spacing:.12em;color:rgba(242,236,224,.45)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(242,236,224,.25);border-radius:2px}
  input[type=range]::-moz-range-track{height:2px;background:rgba(242,236,224,.25);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;margin-top:-12px;border-radius:50%;border:none;
    background:radial-gradient(circle at 34% 32%,#fff6e2,var(--kin));
    box-shadow:0 0 16px rgba(232,185,106,.55);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:26px;height:26px;border-radius:50%;border:none;
    background:radial-gradient(circle at 34% 32%,#fff6e2,var(--kin));
    box-shadow:0 0 16px rgba(232,185,106,.55);cursor:pointer;
  }
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:rgba(242,236,224,.38);letter-spacing:.1em}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;cursor:pointer;
    background:rgba(242,236,224,.06);border:1px solid rgba(242,236,224,.16);
    color:var(--paper);font:inherit;font-size:13px;letter-spacing:.06em;
    transition:background .2s,border-color .2s;
  }
  .chip .sw{width:13px;height:13px;border-radius:50%}
  .chip[aria-checked=true]{background:rgba(232,185,106,.16);border-color:var(--kin)}
  .seg{display:flex;gap:7px}
  .seg .chip{flex:1;justify-content:center;padding:9px 4px}
  .pair{display:grid;gap:14px}
  @media (min-width:480px){ .pair{grid-template-columns:1fr 1fr} }

  .actions{display:flex;gap:10px}
  .go{
    flex:1;padding:15px;border:none;border-radius:4px;cursor:pointer;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
    font-size:17px;letter-spacing:.4em;text-indent:.4em;color:#2a1c05;font-weight:600;
    background:linear-gradient(180deg,#fbe6b6,var(--kin));
    box-shadow:0 0 30px rgba(232,185,106,.3);transition:transform .12s ease;
  }
  .go:active{transform:translateY(1px)}
  .ghost{
    padding:13px 15px;border-radius:4px;cursor:pointer;background:transparent;
    border:1px solid rgba(242,236,224,.28);color:var(--paper);
    font:inherit;font-size:13px;letter-spacing:.1em;white-space:nowrap;
  }
  .ghost[aria-pressed=true]{border-color:var(--kin);color:var(--kin-soft)}

  .bar{display:none;align-items:center;justify-content:space-between;gap:14px}
  .bar span{font-size:13px;letter-spacing:.16em;color:var(--mist);font-variant-numeric:tabular-nums}
  body.running .settings{display:none}
  body.running .bar{display:flex}

  button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--kin-soft);outline-offset:3px}
  @media (max-width:360px){ #countOut{font-size:32px} .chip{font-size:12px;padding:8px 10px} }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="notice" hidden>
  <h2>はじめに</h2>
  <p>光の明滅をともなう映像が流れます。光に敏感な方、過去に発作の経験がある方は、明るい部屋で、画面から離れてご覧ください。体調に変化を感じたときは、すぐに画面から目を離してください。</p>
  <p>音は最初オフになっています。画面下の「音」で切り替えられます。</p>
  <button id="noticeGo">はじめる</button>
</div>

<header id="head">
  <h1>いつでも花火</h1>
  <p>季節も場所も選ばない、ひとりぶんの花火大会</p>
</header>

<p id="hint">空をふれると、一発だけ上がります</p>

<div id="finale" aria-live="polite">
  <p>おしまい。<br>またいつでも。</p>
  <button class="ghost" id="again">もう一度</button>
</div>

<section id="panel">
  <div class="stack">
    <div class="settings">
      <div>
        <label class="label" for="count">打ち上げ数</label>
        <div class="countline">
          <output id="countOut" for="count">50</output><span class="unit">発</span>
          <span class="est" id="est"></span>
        </div>
        <input id="count" type="range" min="10" max="200" step="10" value="50">
        <div class="ticks"><span>10</span><span>200</span></div>
      </div>

      <div>
        <span class="label" id="colorLabel">色</span>
        <div class="chips" role="radiogroup" aria-labelledby="colorLabel" id="colors"></div>
      </div>

      <div class="pair">
        <div>
          <span class="label" id="paceLabel">テンポ</span>
          <div class="seg" role="radiogroup" aria-labelledby="paceLabel" id="paces"></div>
        </div>
        <div>
          <span class="label" id="volleyLabel">ひと組の数</span>
          <div class="seg" role="radiogroup" aria-labelledby="volleyLabel" id="volleys"></div>
        </div>
      </div>

      <div class="actions">
        <button class="go" id="go">打ち上げる</button>
        <button class="ghost" id="sound" aria-pressed="false">音 オフ</button>
      </div>
    </div>

    <div class="bar">
      <span id="left">のこり 50 発</span>
      <button class="ghost" id="stop">止める</button>
    </div>
  </div>
</section>

<script>
(function(){
  "use strict";
  var TAU = Math.PI*2;

  /* ================= 画面 ================= */
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var fx = document.createElement('canvas'),  fctx = fx.getContext('2d');
  var bg = document.createElement('canvas'),  bctx = bg.getContext('2d');
  var bl = document.createElement('canvas'),  blctx = bl.getContext('2d');
  var W=0, H=0, P=1, horizon=0, BW=0, BH=0;
  var canFilter = (typeof blctx.filter === 'string');

  var stars=[], roofs=[], lights=[];
  for (var i=0;i<190;i++) stars.push({x:Math.random(), y:Math.random()*0.74, r:Math.random()*1.1+0.22, a:Math.random()*0.55+0.16});
  var rx=0;
  while (rx<1){ var rw=0.012+Math.random()*0.035; roofs.push({x:rx,w:rw,h:0.012+Math.random()*0.03}); rx+=rw*0.85; }
  for (var j=0;j<24;j++) lights.push({x:Math.random(), y:Math.random(), a:Math.random()*0.5+0.25});

  function resize(){
    P = Math.min(window.devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    [cv,fx,bg].forEach(function(c){ c.width=Math.round(W*P); c.height=Math.round(H*P); });
    [ctx,fctx,bctx].forEach(function(c){ c.setTransform(P,0,0,P,0,0); });
    BW = Math.max(80, Math.round(W/3)); BH = Math.max(80, Math.round(H/3));
    bl.width = BW; bl.height = BH;
    if (canFilter) blctx.filter = 'blur(2px)';
    horizon = Math.round(H*0.79);
    paintSky();
  }

  function paintSky(){
    bctx.clearRect(0,0,W,H);
    var g = bctx.createLinearGradient(0,0,0,horizon);
    g.addColorStop(0,'#04060f'); g.addColorStop(.5,'#0a1130'); g.addColorStop(1,'#1a2450');
    bctx.fillStyle=g; bctx.fillRect(0,0,W,horizon);

    var glow = bctx.createRadialGradient(W*.5,horizon,0,W*.5,horizon,Math.max(W,H)*.55);
    glow.addColorStop(0,'rgba(255,192,124,.13)'); glow.addColorStop(1,'rgba(255,192,124,0)');
    bctx.fillStyle=glow; bctx.fillRect(0,0,W,horizon);

    bctx.fillStyle='#eaf0ff';
    stars.forEach(function(s){ bctx.globalAlpha=s.a; bctx.beginPath(); bctx.arc(s.x*W, s.y*horizon, s.r,0,TAU); bctx.fill(); });
    bctx.globalAlpha=1;

    var mx=W*.84, my=horizon*.19, mr=Math.max(11, Math.min(W,H)*.021);
    var halo=bctx.createRadialGradient(mx,my,0,mx,my,mr*7);
    halo.addColorStop(0,'rgba(226,235,255,.2)'); halo.addColorStop(1,'rgba(226,235,255,0)');
    bctx.fillStyle=halo; bctx.beginPath(); bctx.arc(mx,my,mr*7,0,TAU); bctx.fill();
    bctx.fillStyle='rgba(238,243,255,.9)'; bctx.beginPath(); bctx.arc(mx,my,mr,0,TAU); bctx.fill();

    var wg=bctx.createLinearGradient(0,horizon,0,H);
    wg.addColorStop(0,'#0e1738'); wg.addColorStop(1,'#04060f');
    bctx.fillStyle=wg; bctx.fillRect(0,horizon,W,H-horizon);
    bctx.strokeStyle='rgba(200,220,255,.06)'; bctx.lineWidth=1;
    for (var k=1;k<8;k++){ var y=horizon+(H-horizon)*(k/9);
      bctx.beginPath(); bctx.moveTo(W*.04*k,y); bctx.lineTo(W-W*.035*k,y); bctx.stroke(); }

    bctx.fillStyle='#01020a';
    bctx.beginPath();
    bctx.moveTo(0,horizon); bctx.lineTo(0,horizon-H*.055);
    bctx.quadraticCurveTo(W*.19,horizon-H*.135,W*.37,horizon-H*.04);
    bctx.quadraticCurveTo(W*.5,horizon+H*.005,W*.63,horizon-H*.05);
    bctx.quadraticCurveTo(W*.83,horizon-H*.13,W,horizon-H*.028);
    bctx.lineTo(W,horizon); bctx.closePath(); bctx.fill();

    bctx.fillStyle='#000208';
    roofs.forEach(function(r){ var h=r.h*H; bctx.fillRect(r.x*W, horizon-h, r.w*W, h+2); });
    lights.forEach(function(l){
      var r=roofs[Math.floor(l.x*roofs.length)]||roofs[0], h=r.h*H;
      bctx.globalAlpha=l.a; bctx.fillStyle='#ffcf87';
      bctx.fillRect(r.x*W+r.w*W*.35, horizon-h*(.35+l.y*.35), Math.max(1.5,r.w*W*.16), Math.max(1.5,h*.16));
    });
    bctx.globalAlpha=1;
  }

  /* ============ 光の粒（スプライト） ============ */
  var spriteCache = {};
  function rgbaOf(hex,a){
    var n = parseInt(hex.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }
  // にじみ：中心から一気に落ちる。広がりすぎると画面が白く飽和して形が消える
  function sprite(color){
    var s = spriteCache[color];
    if (s) return s;
    var S=64, c=document.createElement('canvas'); c.width=c.height=S;
    var g=c.getContext('2d');
    var grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    grd.addColorStop(0,   'rgba(255,255,255,.85)');
    grd.addColorStop(.05, rgbaOf(color,.95));
    grd.addColorStop(.18, rgbaOf(color,.55));
    grd.addColorStop(.36, rgbaOf(color,.16));
    grd.addColorStop(.62, rgbaOf(color,.03));
    grd.addColorStop(1,   rgbaOf(color,0));
    g.fillStyle=grd; g.fillRect(0,0,S,S);
    spriteCache[color]=c; return c;
  }

  // 芯：星ひとつの位置をはっきり見せる小さく硬い点
  var coreCache = {};
  function core(color){
    var s = coreCache[color];
    if (s) return s;
    var S=24, c=document.createElement('canvas'); c.width=c.height=S;
    var g=c.getContext('2d');
    var grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    grd.addColorStop(0,   'rgba(255,255,255,1)');
    grd.addColorStop(.20, 'rgba(255,255,255,.6)');
    grd.addColorStop(.42, rgbaOf(color,1));
    grd.addColorStop(.78, rgbaOf(color,.45));
    grd.addColorStop(1,   rgbaOf(color,0));
    g.fillStyle=grd; g.fillRect(0,0,S,S);
    coreCache[color]=c; return c;
  }

  /* ================= 色と設定 ================= */
  var PALETTES = {
    omakase: ['#ff6161','#ffd166','#7ee8fa','#c79cff','#8affc1','#fff3c4','#ff9ec7'],
    kurenai: ['#ff4d4d','#ff7a45','#ffb36b','#ffe0a3','#ff5f7e'],
    kin:     ['#ffd57a','#ffbf47','#fff0c2','#ffa62b','#fffbe8'],
    ai:      ['#6fd3ff','#5b86ff','#a8e6ff','#cfe0ff','#7ef0e0'],
    sakura:  ['#ffb7d5','#ff8fbf','#ffe1ec','#ffd0e0','#ff9ec7'],
    nanairo: ['#ff5a5a','#ff9f43','#ffe066','#7bed9f','#54a0ff','#a55eea','#ff6b9d']
  };
  var COLOR_LIST = [
    {id:'omakase', name:'おまかせ', sw:'linear-gradient(135deg,#ff6161,#ffd166,#7ee8fa,#c79cff)'},
    {id:'kurenai', name:'紅',       sw:'linear-gradient(135deg,#ff4d4d,#ffb36b)'},
    {id:'kin',     name:'金',       sw:'linear-gradient(135deg,#ffbf47,#fff0c2)'},
    {id:'ai',      name:'藍',       sw:'linear-gradient(135deg,#5b86ff,#a8e6ff)'},
    {id:'sakura',  name:'桜',       sw:'linear-gradient(135deg,#ff8fbf,#ffe1ec)'},
    {id:'nanairo', name:'七色',     sw:'linear-gradient(135deg,#ff5a5a,#ffe066,#54a0ff,#a55eea)'}
  ];
  var PACES = [
    {id:'shittori', name:'しっとり', gap:2600},
    {id:'futsu',    name:'ふつう',   gap:1300},
    {id:'renpatsu', name:'連発',     gap:480}
  ];
  var VOLLEYS = [
    {id:'hitotsu', name:'ひとつ', n:1, stagger:0},
    {id:'mittsu',  name:'三発',   n:3, stagger:110},
    {id:'issei',   name:'一斉',   n:6, stagger:70}
  ];

  var conf = { count:50, color:'omakase', pace:'futsu', volley:'hitotsu', sound:false };
  function paceObj(){ return PACES.filter(function(p){return p.id===conf.pace;})[0] || PACES[1]; }
  function volleyObj(){ return VOLLEYS.filter(function(v){return v.id===conf.volley;})[0] || VOLLEYS[0]; }

  /* ================= 音 ================= */
  /* 正弦波を一切使わず、ノイズと共振とたたみ込みだけで鳴らしている。
     実際の花火の音も「特定の高さを持たない空気の破裂」なので、こちらのほうが近い。 */
  var AC=null, master=null, comp=null, drive=null, revSend=null;
  var whiteBuf=null, brownBuf=null, lastBoom=0, canPan=false;

  function rnd(a,b){ return a+Math.random()*(b-a); }
  function satCurve(k){
    var n=1024, c=new Float32Array(n);
    for (var i=0;i<n;i++){ var x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
    return c;
  }

  // 白＝破裂の先端用、ブラウン（-6dB/oct）＝腹に来る低域用
  function makeNoise(sec, brown){
    var len=Math.floor(AC.sampleRate*sec);
    var b=AC.createBuffer(1,len,AC.sampleRate);
    var d=b.getChannelData(0), last=0, max=0, i;
    for (i=0;i<len;i++){
      var w=Math.random()*2-1;
      if (brown){ last=(last+0.019*w)/1.019; d[i]=last; if (Math.abs(last)>max) max=Math.abs(last); }
      else d[i]=w;
    }
    if (brown && max>0.0001){ for (i=0;i<len;i++) d[i]/=max; }
    return b;
  }

  // 屋外の返り：なめらかな残響ではなく、建物と山からの飛び飛びの反射
  function makeIR(){
    var sr=AC.sampleRate, len=Math.floor(sr*2.4);
    var ir=AC.createBuffer(2,len,sr);
    var taps=[[0.082,0.30],[0.158,0.23],[0.281,0.18],[0.43,0.13],[0.66,0.09],[0.94,0.06]];
    for (var ch=0; ch<2; ch++){
      var d=ir.getChannelData(ch), lp=0, i, j;
      for (i=0;i<len;i++){
        var env=Math.pow(1-i/len, 2.4)*0.055;
        lp += ((Math.random()*2-1)*env - lp)*0.1;   // 遠いほど高域が削れる
        d[i]=lp;
      }
      for (var k=0;k<taps.length;k++){
        var pos=Math.floor((taps[k][0]*(ch?1.06:0.95)+Math.random()*0.014)*sr);
        var w=Math.floor(sr*0.04);
        for (j=0;j<w && pos+j<len;j++){
          d[pos+j]+=(Math.random()*2-1)*taps[k][1]*Math.pow(1-j/w,2.0);
        }
      }
    }
    return ir;
  }

  function initAudio(ctx){
    if (AC) return true;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!ctx && !Ctor) return false;
    AC = ctx || new Ctor();
    canPan = (typeof AC.createStereoPanner === 'function');

    comp = AC.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=18; comp.ratio.value=7;
    comp.attack.value=0.004; comp.release.value=0.28;
    var out = AC.createGain(); out.gain.value=1.22;
    comp.connect(out); out.connect(AC.destination);

    master = AC.createGain(); master.gain.value=0.5; master.connect(comp);

    // 低域はここを通す。歪ませて倍音を足し、鳴らない低音をスマホでも感じさせる
    drive = AC.createWaveShaper();
    drive.curve = satCurve(1.6);
    if ('oversample' in drive) drive.oversample='2x';
    var driveLP = AC.createBiquadFilter(); driveLP.type='lowpass'; driveLP.frequency.value=340;
    drive.connect(driveLP); driveLP.connect(master);

    whiteBuf = makeNoise(2.0,false);
    brownBuf = makeNoise(3.0,true);

    revSend = AC.createGain(); revSend.gain.value=0.62;
    if (typeof AC.createConvolver === 'function'){
      var cv = AC.createConvolver(); cv.normalize=false; cv.buffer=makeIR();
      var rl = AC.createBiquadFilter(); rl.type='lowpass'; rl.frequency.value=1200;
      revSend.connect(cv); cv.connect(rl); rl.connect(master);
    } else {
      var dl=AC.createDelay(1.0); dl.delayTime.value=0.3;
      var fb=AC.createGain(); fb.gain.value=0.25;
      var fl=AC.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=700;
      dl.connect(fl); fl.connect(fb); fb.connect(dl); revSend.connect(dl); dl.connect(master);
    }
    return true;
  }

  function panFor(x){
    if (!canPan) return null;
    var p=AC.createStereoPanner();
    p.pan.value=Math.max(-0.8, Math.min(0.8, (x/W)*1.6-0.8));
    return p;
  }

  function boomSound(power, delaySec, x, big, dist){
    if (!conf.sound || !AC) return;
    var nowMs=performance.now();
    if (nowMs-lastBoom < 42) return;
    lastBoom=nowMs;
    playBoom(AC.currentTime+delaySec, power, x, big, dist||300);
  }

  /* ドン：①破裂の先端 ②胴 ③圧力波 ④ゆらぎながら遠ざかる轟き
     どの層も毎回わずかに違う値で鳴らすので、同じ音が二度出ない */
  function playBoom(t, power, x, big, dist){
    var bus=AC.createGain(); bus.gain.value=1;
    // 空気による高域の吸収。遠いほど角が取れて「パン」ではなく「ドン」になる
    var air=AC.createBiquadFilter(); air.type='lowpass'; air.Q.value=0.7;
    air.frequency.value=Math.max(2000, 11000-dist*17);
    var p=panFor(x);
    bus.connect(air);
    if (p){ air.connect(p); p.connect(master); p.connect(revSend); }
    else { air.connect(master); air.connect(revSend); }

    // ① 先端のクラック
    var cl=rnd(0.05,0.085);
    var tr=AC.createBufferSource(); tr.buffer=whiteBuf; tr.playbackRate.value=rnd(1.6,2.6);
    var thp=AC.createBiquadFilter(); thp.type='highpass'; thp.frequency.value=rnd(380,760);
    var tpk=AC.createBiquadFilter(); tpk.type='peaking'; tpk.frequency.value=rnd(600,1100); tpk.Q.value=1.2; tpk.gain.value=5;
    var tg=AC.createGain();
    tg.gain.setValueAtTime(0.0001,t);
    tg.gain.linearRampToValueAtTime(0.26*power,t+0.003);
    tg.gain.exponentialRampToValueAtTime(0.0001,t+cl);
    tr.connect(thp); thp.connect(tpk); tpk.connect(tg); tg.connect(bus);
    tr.start(t, rnd(0,1.0)); tr.stop(t+cl+0.03);

    // ② 胴
    var bl=rnd(0.3,0.5);
    var bd=AC.createBufferSource(); bd.buffer=whiteBuf; bd.playbackRate.value=rnd(0.8,1.1);
    var blp=AC.createBiquadFilter(); blp.type='lowpass';
    blp.frequency.setValueAtTime(rnd(1100,1600),t);
    blp.frequency.exponentialRampToValueAtTime(rnd(150,240),t+bl);
    var bg=AC.createGain();
    bg.gain.setValueAtTime(0.0001,t);
    bg.gain.linearRampToValueAtTime(0.4*power,t+rnd(0.008,0.016));
    bg.gain.exponentialRampToValueAtTime(0.0001,t+bl);
    bd.connect(blp); blp.connect(bg); bg.connect(bus);
    bd.start(t, rnd(0,1.0)); bd.stop(t+bl+0.05);

    // ③ 圧力波：共振させたブラウンノイズ。音程を持たないまま重心だけが沈む
    var sub=AC.createBufferSource(); sub.buffer=brownBuf; sub.playbackRate.value=rnd(0.7,1.0);
    var res=AC.createBiquadFilter(); res.type='lowpass'; res.Q.value=rnd(7,11);
    // 発破などの爆発音は1/3オクターブで63Hz・80Hz帯が突出する。そこに重心を置く
    res.frequency.setValueAtTime(big?rnd(165,200):rnd(135,170),t);
    res.frequency.exponentialRampToValueAtTime(big?rnd(62,72):rnd(72,84),t+rnd(0.1,0.16));
    res.frequency.exponentialRampToValueAtTime(52,t+0.9);
    var sg=AC.createGain();
    sg.gain.setValueAtTime(0.0001,t);
    sg.gain.linearRampToValueAtTime(0.95*power,t+0.006);
    sg.gain.exponentialRampToValueAtTime(0.24*power,t+rnd(0.18,0.28));
    sg.gain.exponentialRampToValueAtTime(0.0001,t+(big?1.15:0.85));
    sub.connect(res); res.connect(sg); sg.connect(drive);
    sub.start(t, rnd(0,1.5)); sub.stop(t+1.3);

    // ④ 轟き：きれいに減衰させず、塊が揺れながら遠ざかる
    var tl=big?rnd(1.6,2.1):rnd(1.1,1.5);
    var rb=AC.createBufferSource(); rb.buffer=brownBuf; rb.playbackRate.value=rnd(0.5,0.8);
    var rlp=AC.createBiquadFilter(); rlp.type='lowpass';
    rlp.frequency.setValueAtTime(rnd(180,260),t);
    rlp.frequency.exponentialRampToValueAtTime(rnd(65,95),t+tl);
    var rg=AC.createGain();
    rg.gain.setValueAtTime(0.0001,t+0.02);
    rg.gain.linearRampToValueAtTime(0.28*power,t+0.09);
    for (var i=1;i<=5;i++){
      var lv=0.28*power*Math.pow(1-i/6,2.1)*rnd(0.55,1.25);
      rg.gain.linearRampToValueAtTime(Math.max(0.0005,lv), t+0.09+(tl-0.09)*(i/5));
    }
    rg.gain.linearRampToValueAtTime(0.0001,t+tl+0.15);
    rb.connect(rlp); rlp.connect(rg); rg.connect(drive);
    var rs=AC.createGain(); rs.gain.value=0.7; rg.connect(rs); rs.connect(revSend);
    rb.start(t+0.02, rnd(0,1.2)); rb.stop(t+tl+0.25);
  }

  // 万雷：一続きのノイズではなく、ばらばらに弾ける小さな破裂の集まり
  function crackleSound(delaySec){
    if (!conf.sound || !AC) return;
    var t0=AC.currentTime+delaySec+0.08;
    for (var i=0;i<22;i++){
      var tt=t0+Math.pow(Math.random(),0.7)*1.15;
      var s=AC.createBufferSource(); s.buffer=whiteBuf; s.playbackRate.value=rnd(2.2,4.0);
      var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=rnd(1800,5200); bp.Q.value=rnd(2,6);
      var g=AC.createGain(); var a=rnd(0.05,0.16);
      g.gain.setValueAtTime(0.0001,tt);
      g.gain.linearRampToValueAtTime(a,tt+0.002);
      g.gain.exponentialRampToValueAtTime(0.0001,tt+rnd(0.02,0.05));
      s.connect(bp); bp.connect(g); g.connect(master);
      var sd=AC.createGain(); sd.gain.value=0.5; g.connect(sd); sd.connect(revSend);
      s.start(tt, rnd(0,1.0)); s.stop(tt+0.09);
    }
  }

  // 打ち上げ：筒を出る「ドッ」と、上がっていく笛（こちらもノイズを絞ったもの）
  function whistleSound(dur){
    if (!conf.sound || !AC) return;
    var t=AC.currentTime+210/343, d=Math.min(2.2,dur/1000);   // 打揚筒までの距離ぶん遅れる

    var m=AC.createBufferSource(); m.buffer=brownBuf; m.playbackRate.value=rnd(0.8,1.2);
    var ml=AC.createBiquadFilter(); ml.type='lowpass'; ml.frequency.value=rnd(140,220); ml.Q.value=4;
    var mg=AC.createGain();
    mg.gain.setValueAtTime(0.0001,t);
    mg.gain.linearRampToValueAtTime(0.26,t+0.006);
    mg.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
    m.connect(ml); ml.connect(mg); mg.connect(drive);
    m.start(t, rnd(0,1.5)); m.stop(t+0.22);

    var src=AC.createBufferSource(); src.buffer=whiteBuf; src.loop=true; src.playbackRate.value=rnd(0.9,1.2);
    var bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=rnd(14,22);
    bp.frequency.setValueAtTime(rnd(520,680),t);
    bp.frequency.exponentialRampToValueAtTime(rnd(1250,1600),t+d);
    var lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=rnd(4,8);
    var lg=AC.createGain(); lg.gain.value=rnd(20,45);
    lfo.connect(lg); lg.connect(bp.frequency); lfo.start(t); lfo.stop(t+d+0.1);
    var hiss=AC.createBiquadFilter(); hiss.type='highpass'; hiss.frequency.value=900;
    var hg=AC.createGain(); hg.gain.value=0.22;
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.05,t+0.15);
    g.gain.setValueAtTime(0.05,t+d*0.75);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(bp); bp.connect(g);
    src.connect(hiss); hiss.connect(hg); hg.connect(g);
    g.connect(master);
    var ws=AC.createGain(); ws.gain.value=0.4; g.connect(ws); ws.connect(revSend);
    src.start(t, rnd(0,1.0)); src.stop(t+d+0.12);
  }

  /* ================= 花火 ================= */
  var shells=[], sparks=[], smokes=[], flashes=[], pending=[], booms=[];
  var shakeAmp=0, allowShake=true;
  var GS=0.115, GP=0.05;
  var MAXSPARK=4400;
  var quality=1;

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function paletteColors(){
    var set = PALETTES[conf.color] || PALETTES.omakase;
    var c1 = pick(set), c2 = pick(set);
    if (conf.color==='nanairo'||conf.color==='omakase') return [c1, Math.random()<.5?c2:c1];
    return [c1, c2];
  }

  function launch(x, ty, opt){
    opt = opt || {};
    if (x==null) x = W*(0.14+Math.random()*0.72);
    if (ty==null) ty = H*(0.11+Math.random()*0.3);
    var from = H*0.97, dist = from-ty;
    var vy = -Math.sqrt(2*GS*dist);
    var cols;
    if (opt.color && PALETTES[opt.color]) cols = [pick(PALETTES[opt.color]), pick(PALETTES[opt.color])];
    else cols = paletteColors();
    shells.push({
      x:x, y:from, vx:(Math.random()-.5)*0.45, vy:vy, ty:ty,
      colors: cols,
      type: opt.type || pick(['kiku','kiku','kiku','botan','botan','yanagi','senrin','kamuro','henka']),
      crackle: opt.crackle!=null ? opt.crackle : Math.random()<0.3,
      size: opt.size || (0.82+Math.random()*0.42)
    });
    whistleSound(Math.abs(vy)/GS*16.67);
  }

  function addSpark(x,y,ang,sp,color,life,size,opt){
    if (sparks.length > MAXSPARK*quality) return null;
    opt = opt || {};
    var p = {
      x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      c:color, c2:opt.c2||null, at:opt.at||0.55,
      life:life, max:life, r:size, tw:!!opt.tw, ph:Math.random()*TAU,
      drag:opt.drag||0.966, g:opt.g||GP
    };
    sparks.push(p); return p;
  }

  function addSmoke(x,y,r){
    if (smokes.length>140) return;
    smokes.push({x:x, y:y, r:r, vx:(Math.random()-.5)*0.25, vy:-0.08-Math.random()*0.1, life:2600+Math.random()*1800, max:4400, grow:0.045});
  }

  function explode(s, now){
    var R=Math.min(W,H);
    var c1=s.colors[0], c2=s.colors[1];
    var base=R*0.0058*s.size;
    var q=quality;
    var n,i,ang,sp;

    // 音が届くまでの時間を、実際の距離から計算する。
    // 開花高度は画面上の位置を 110〜370m に対応させ、観客までの水平距離は
    // 煙火消費の技術基準にある保安距離（10号玉で半径200m以上）に合わせて210mとした。
    var hM = 110 + ((horizon - s.y)/horizon)*210*s.size;
    var distM = Math.sqrt(210*210 + hM*hM);
    var delaySec = distM/343;                 // 音速 343m/s
    var delayMs = delaySec*1000;
    var power = 0.55 + 0.45*s.size;

    flashes.push({x:s.x, y:s.y, r:R*0.28*s.size, life:210, max:230, c:c1, wave:R*0.5*s.size});
    for (i=0;i<5;i++) addSmoke(s.x+(Math.random()-.5)*R*0.06, s.y+(Math.random()-.5)*R*0.06, R*0.02+Math.random()*R*0.02);

    if (s.type==='kiku'){                       // 菊：長い尾を引く真円
      n=Math.round(96*q);
      for (i=0;i<n;i++){
        ang=(i/n)*TAU+Math.random()*0.05;
        sp=base*(0.94+Math.random()*0.13);
        addSpark(s.x,s.y,ang,sp, i%9===0?c2:c1, 1600+Math.random()*520, 1.8, {tw:Math.random()<.28});
      }
    } else if (s.type==='henka'){               // 変化菊：途中で色が変わる
      n=Math.round(96*q);
      for (i=0;i<n;i++){
        ang=(i/n)*TAU+Math.random()*0.05;
        sp=base*(0.94+Math.random()*0.13);
        addSpark(s.x,s.y,ang,sp,c1,1800+Math.random()*500,1.8,{c2:c2, at:0.5});
      }
    } else if (s.type==='botan'){               // 牡丹：芯まで詰まった球
      n=Math.round(128*q);
      for (i=0;i<n;i++){
        ang=Math.random()*TAU;
        sp=base*1.05*Math.cbrt(Math.random());
        addSpark(s.x,s.y,ang,sp, Math.random()<.5?c1:c2, 1150+Math.random()*620, 2.0, {tw:Math.random()<.22});
      }
    } else if (s.type==='yanagi'){              // 柳：ゆっくり垂れ下がる
      n=Math.round(72*q);
      for (i=0;i<n;i++){
        ang=(i/n)*TAU+Math.random()*0.1;
        sp=base*0.5*(0.7+Math.random()*0.5);
        addSpark(s.x,s.y,ang,sp,c1,2800+Math.random()*1000,1.9,{drag:0.983, g:GP*1.55});
      }
    } else if (s.type==='senrin'){              // 千輪：小さな花がいっせいに
      n=Math.round(160*q);
      for (i=0;i<n;i++){
        ang=Math.random()*TAU;
        sp=base*(0.34+Math.random()*0.92);
        addSpark(s.x,s.y,ang,sp, Math.random()<.5?c1:c2, 620+Math.random()*520, 1.4, {tw:true});
      }
    } else {                                    // 冠：二重の輪
      n=Math.round(84*q);
      for (i=0;i<n;i++) addSpark(s.x,s.y,(i/n)*TAU, base*1.02, c1, 1700+Math.random()*420, 1.9, {});
      var m=Math.round(52*q);
      for (i=0;i<m;i++) addSpark(s.x,s.y,(i/m)*TAU+0.06, base*0.5, c2, 1250+Math.random()*420, 1.7, {tw:Math.random()<.4});
    }

    if (s.crackle){                             // 万雷：ぱちぱちと弾ける芯
      var k=Math.round(48*q);
      for (i=0;i<k;i++){
        ang=Math.random()*TAU;
        sp=base*(0.2+Math.random()*0.5);
        addSpark(s.x,s.y,ang,sp,'#fff6de', 900+Math.random()*700, 1.1, {tw:true, drag:0.94});
      }
      crackleSound(delaySec);
    }
    boomSound(power, delaySec, s.x, s.size>1.05, distM);
    booms.push({ t: now+delayMs, amp: Math.min(3.0, 1.6*power*s.size) });
  }

  /* ================= 進行 ================= */
  var running=false, remaining=0, acc=0, gap=1300, last=0;
  var leftEl=document.getElementById('left');
  var finaleEl=document.getElementById('finale');
  var hintEl=document.getElementById('hint');

  function startShow(){
    if(!running&&window.GameAnalytics)window.GameAnalytics.gameStart();   // GA4 game_start
    finaleEl.classList.remove('show');
    remaining=conf.count; gap=paceObj().gap; acc=gap*0.4;
    running=true; document.body.classList.add('running');
    updateLeft(); hintEl.classList.add('gone');
  }
  function stopShow(){ remaining=0; running=false; document.body.classList.remove('running'); }
  function finish(){ running=false; document.body.classList.remove('running'); finaleEl.classList.add('show'); }
  function updateLeft(){ leftEl.textContent='のこり '+remaining+' 発'; }

  function fireVolley(now){
    var v=volleyObj();
    var n=Math.min(remaining, v.n===1?1:(v.n-1+Math.round(Math.random()*2)));
    var finaleMode = remaining <= Math.max(3, Math.round(conf.count*0.1));
    if (finaleMode) n = Math.min(remaining, n+1);
    for (var i=0;i<n;i++){
      pending.push({t: now + i*v.stagger + Math.random()*40});
      remaining--;
    }
    updateLeft();
  }

  function tick(dt, now){
    if (running){
      acc+=dt;
      var g=gap;
      if (remaining<=Math.max(3,Math.round(conf.count*0.1))) g=Math.min(gap, 220); // 大詰め
      if (acc>=g && remaining>0){ acc=-(Math.random()*g*0.18); fireVolley(now); }
      if (remaining===0 && shells.length===0 && pending.length===0 && sparks.length<40) finish();
    }
    for (var q=pending.length-1;q>=0;q--){
      if (now>=pending[q].t){ launch(pending[q].x, pending[q].ty, pending[q].opt); pending.splice(q,1); }
    }

    var f=dt/16.67;
    for (var i=shells.length-1;i>=0;i--){
      var s=shells[i];
      s.x+=s.vx*f; s.y+=s.vy*f; s.vy+=GS*f;
      addSpark(s.x+(Math.random()-.5)*2, s.y, Math.PI/2+(Math.random()-.5), 0.45, '#ffd49a', 340, 1.15, {drag:0.9, g:GP*0.4});
      if (s.vy>=-0.4 || s.y<=s.ty){ explode(s, now); shells.splice(i,1); }
    }
    for (var k=sparks.length-1;k>=0;k--){
      var p=sparks[k];
      p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=p.g*f;
      var d=Math.pow(p.drag,f); p.vx*=d; p.vy*=d;
      p.life-=dt;
      if (p.life<=0 || p.y>horizon-2) sparks.splice(k,1);
    }
    for (var m=smokes.length-1;m>=0;m--){
      var sm=smokes[m];
      sm.x+=sm.vx*f; sm.y+=sm.vy*f; sm.r+=sm.grow*f; sm.life-=dt;
      if (sm.life<=0) smokes.splice(m,1);
    }
    for (var fl=flashes.length-1;fl>=0;fl--){
      flashes[fl].life-=dt;
      if (flashes[fl].life<=0) flashes.splice(fl,1);
    }
    for (var bm=booms.length-1;bm>=0;bm--){
      if (now>=booms[bm].t){
        if (allowShake) shakeAmp=Math.max(shakeAmp, booms[bm].amp);
        booms.splice(bm,1);
      }
    }
    shakeAmp *= Math.pow(0.84, f);
    if (shakeAmp<0.05) shakeAmp=0;
  }

  function render(now, dt){
    var ff=dt/16.67, subOK=quality>0.82, haloOK=quality>0.5;
    // 尾を残しながら消していく
    fctx.globalCompositeOperation='destination-out';
    fctx.fillStyle='rgba(0,0,0,'+Math.min(0.5, 0.09*(dt/16.67))+')';
    fctx.fillRect(0,0,W,H);
    fctx.globalCompositeOperation='lighter';

    for (var i=0;i<sparks.length;i++){
      var p=sparks[i];
      var t=p.life/p.max;
      var a=Math.min(1, p.life/380);
      if (p.tw) a*=0.42+0.58*Math.abs(Math.sin(now*0.019+p.ph));
      if (a<0.07) continue;
      var col=(p.c2 && t<p.at)?p.c2:p.c;
      if (haloOK || a>0.45){
        var d=p.r*3.9;
        fctx.globalAlpha=a;
        fctx.drawImage(sprite(col), p.x-d/2, p.y-d/2, d, d);
      }
      if (a>0.2){
        var hot=(p.max-p.life)<170 ? 1.55 : 1;      // 開いた直後だけ強く光る
        var cd=p.r*1.7*hot, cs=core(col);
        fctx.globalAlpha=a;
        fctx.drawImage(cs, p.x-cd/2, p.y-cd/2, cd, cd);
        // 速い星は前フレームとの間を埋めて、点線ではなく一本の線にする
        var v2=p.vx*p.vx+p.vy*p.vy;
        if (subOK && v2>1.4){
          var nsub=v2>16?2:1;
          fctx.globalAlpha=a*0.5;
          for (var k=1;k<=nsub;k++){
            var u=k/(nsub+1);
            fctx.drawImage(cs, p.x-p.vx*u*ff-cd/2, p.y-p.vy*u*ff-cd/2, cd, cd);
          }
        }
      }
    }
    fctx.globalAlpha=1;

    // にじみ（ブルーム）
    blctx.setTransform(1,0,0,1,0,0);
    blctx.globalCompositeOperation='copy';
    blctx.drawImage(fx,0,0,BW,BH);
    blctx.globalCompositeOperation='source-over';

    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,W,H);

    var ox=0, oy=0, over=0;
    if (shakeAmp>0){
      over=Math.ceil(shakeAmp)+2;
      ox=(Math.random()-.5)*shakeAmp*1.6;
      oy=(Math.random()-.5)*shakeAmp*1.0;
    }
    ctx.save();
    ctx.translate(ox,oy);
    ctx.drawImage(bg, -over, -over, W+over*2, H+over*2);

    ctx.globalCompositeOperation='lighter';

    // 破裂の閃光が空と煙を照らす
    for (var q=0;q<flashes.length;q++){
      var fh=flashes[q], fa=fh.life/fh.max;
      var gr=ctx.createRadialGradient(fh.x,fh.y,0,fh.x,fh.y,fh.r);
      gr.addColorStop(0, rgbaOf(fh.c, 0.17*fa*fa));
      gr.addColorStop(0.4, rgbaOf(fh.c, 0.035*fa*fa));
      gr.addColorStop(1, rgbaOf(fh.c, 0));
      ctx.fillStyle=gr; ctx.fillRect(fh.x-fh.r, fh.y-fh.r, fh.r*2, fh.r*2);
      // 広がる衝撃波
      var wr=fh.wave*(1-fa);
      if (wr>4){
        ctx.strokeStyle=rgbaOf('#ffffff', 0.16*fa*fa);
        ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(fh.x, fh.y, wr, 0, TAU); ctx.stroke();
      }
    }

    // ただよう煙
    for (var m=0;m<smokes.length;m++){
      var sm=smokes[m], sa=Math.min(1, sm.life/sm.max)*0.05;
      var sg=ctx.createRadialGradient(sm.x,sm.y,0,sm.x,sm.y,sm.r);
      sg.addColorStop(0,'rgba(150,170,215,'+sa+')');
      sg.addColorStop(1,'rgba(150,170,215,0)');
      ctx.fillStyle=sg; ctx.fillRect(sm.x-sm.r, sm.y-sm.r, sm.r*2, sm.r*2);
    }

    ctx.drawImage(fx,0,0,W,H);
    ctx.globalAlpha=0.34; ctx.drawImage(bl,0,0,W,H); ctx.globalAlpha=1;

    // 水面のうつりこみ
    ctx.save();
    ctx.beginPath(); ctx.rect(0,horizon,W,H-horizon); ctx.clip();
    var band=H-horizon, n=20, sh=band/n;
    for (var s=0;s<n;s++){
      var sy=(horizon-(s+1)*sh)*P;
      if (sy<0) break;
      ctx.globalAlpha=0.2*(1-s/n);
      var wob=Math.sin(now/1100+s*0.7)*(1.1+s*0.65);
      ctx.drawImage(fx, 0, sy, Math.round(W*P), Math.round(sh*P), wob, horizon+s*sh, W, sh+0.6);
    }
    ctx.globalAlpha=0.14;
    ctx.save(); ctx.translate(0, horizon*2); ctx.scale(1,-1);
    ctx.drawImage(bl, 0, horizon-band, W, band, 0, horizon-band, W, band);
    ctx.restore();
    ctx.restore();

    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }

  var fpsAcc=0, fpsN=0;
  function loop(now){
    var dt=Math.min(now-last,48); last=now;
    fpsAcc+=dt; fpsN++;
    if (fpsN>=45){
      var avg=fpsAcc/fpsN; fpsAcc=0; fpsN=0;
      if (avg>26 && quality>0.28) quality-=0.15;
      else if (avg<19 && quality<1) quality=Math.min(1, quality+0.06);
    }
    tick(dt,now); render(now,dt);
    requestAnimationFrame(loop);
  }

  /* ================= 操作 ================= */
  var countEl=document.getElementById('count'), countOut=document.getElementById('countOut'), estEl=document.getElementById('est');
  var colorsEl=document.getElementById('colors'), pacesEl=document.getElementById('paces'), volleysEl=document.getElementById('volleys');
  var soundBtn=document.getElementById('sound');

  function buildRadios(el, list, key, after){
    list.forEach(function(o){
      var b=document.createElement('button');
      b.type='button'; b.className='chip'; b.setAttribute('role','radio'); b.dataset.id=o.id;
      b.innerHTML = o.sw ? '<span class="sw" style="background:'+o.sw+'"></span>'+o.name : o.name;
      b.addEventListener('click', function(){ conf[key]=o.id; sync(); if(after) after(o); save(); });
      el.appendChild(b);
    });
  }
  buildRadios(colorsEl, COLOR_LIST, 'color');
  buildRadios(pacesEl, PACES, 'pace', function(o){ if (running) gap=o.gap; });
  buildRadios(volleysEl, VOLLEYS, 'volley');

  function sync(){
    [[colorsEl,'color'],[pacesEl,'pace'],[volleysEl,'volley']].forEach(function(pair){
      Array.prototype.forEach.call(pair[0].children, function(b){
        b.setAttribute('aria-checked', b.dataset.id===conf[pair[1]]);
      });
    });
    countOut.textContent=conf.count;
    var v=volleyObj();
    var groups=conf.count/(v.n===1?1:v.n-0.5);
    var ms=groups*paceObj().gap;
    var min=Math.max(1, Math.round(ms/60000));
    estEl.textContent='およそ '+min+' 分';
  }

  countEl.addEventListener('input', function(){ conf.count=+countEl.value; sync(); save(); });
  document.getElementById('go').addEventListener('click', startShow);
  document.getElementById('stop').addEventListener('click', stopShow);
  document.getElementById('again').addEventListener('click', function(){ finaleEl.classList.remove('show'); startShow(); });

  soundBtn.addEventListener('click', function(){
    if (!conf.sound){
      if (!initAudio()){ soundBtn.textContent='音 なし'; soundBtn.disabled=true; return; }
      if (AC.state==='suspended') AC.resume();
      conf.sound=true;
    } else conf.sound=false;
    soundBtn.setAttribute('aria-pressed', conf.sound);
    soundBtn.textContent = conf.sound?'音 オン':'音 オフ';
    save();
  });

  cv.addEventListener('pointerdown', function(e){
    var r=cv.getBoundingClientRect();
    var x=e.clientX-r.left, y=e.clientY-r.top;
    launch(x, Math.min(Math.max(y,H*0.07), horizon-H*0.18));
    hintEl.classList.add('gone');
  });

  /* ============ 設定の記憶（使えるときだけ） ============ */
  /* 端末のなかだけに残る。外へ送るものは何もない */
  function save(){
    try { localStorage.setItem('hanabi:conf', JSON.stringify(conf)); } catch(e){}
  }
  function apply(v){
    if (!v) return;
    if (v.count) conf.count=Math.min(200, Math.max(10, v.count));
    if (v.color && PALETTES[v.color]) conf.color=v.color;
    if (v.pace) conf.pace=v.pace;
    if (v.volley) conf.volley=v.volley;
  }
  function load(){
    try { apply(JSON.parse(localStorage.getItem('hanabi:conf'))); } catch(e){}
    return Promise.resolve();
  }
  function seen(){
    try { return localStorage.getItem('hanabi:notice')==='1'; } catch(e){ return false; }
  }
  function markSeen(){
    try { localStorage.setItem('hanabi:notice','1'); } catch(e){}
  }

  /* ================= 起動 ================= */
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    conf.pace='shittori'; conf.volley='hitotsu'; allowShake=false;
  }
  window.addEventListener('resize', resize);
  resize();

  Promise.resolve(load()).then(function(){
    countEl.value=conf.count; sync();
    last=performance.now();
    requestAnimationFrame(loop);
    setTimeout(function(){ if (!running && sparks.length===0) launch(W*0.5, H*0.28); }, 900);

    // 初回だけ注意書きを出す
    var nt=document.getElementById('notice');
    if (!seen()){
      nt.hidden=false;
      document.getElementById('noticeGo').addEventListener('click', function(){
        markSeen(); nt.classList.add('fade');
        setTimeout(function(){ nt.hidden=true; }, 520);
      });
    }
  });

  // オフライン再生用。ストア版（WebView同梱）では無くても動く
  if ('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
